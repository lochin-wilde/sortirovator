[package]
name = "music-sorter-tauri"
version = "0.1.0"
description = "Music Genre Sorter Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = [ "fs-exists", "fs-remove-dir", "dialog-open", "fs-read-file", "fs-write-file", "fs-read-dir", "fs-create-dir", "fs-copy-file", "fs-rename-file"] }
id3 = "1.13"
walkdir = "2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `release` builds.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
