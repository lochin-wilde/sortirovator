<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>&#1052;&#1091;&#1079;&#1099;&#1082;&#1072;&#1083;&#1100;&#1085;&#1099;&#1081; &#1089;&#1086;&#1088;&#1090;&#1080;&#1088; &#8212; &#1072;&#1076;&#1084;&#1080;&#1085;&#1082;&#1072;</title>
<link rel="stylesheet" href="css/styles.css?v=2026.10.28.2">
</head>
<body>

<header class="masthead">
  <div class="masthead-top">
    <h1 data-i18n="admin.heading"></h1>
    <div class="masthead-controls">
      <div class="lang-switch" role="group">
        <button type="button" class="lang-button" data-lang="ru">RU</button>
        <button type="button" class="lang-button" data-lang="en">EN</button>
      </div>
      <form method="POST" action="/logout" class="signout-form">
        <button type="submit" class="link-button" data-i18n="gate.signout"></button>
      </form>
    </div>
  </div>
  <p><a href="/" class="link-button" data-i18n="admin.back"></a></p>
</header>

<main id="admin-main">

<!-- Numbers only: how many testers, runs and tracks. What the tracks were is
     never recorded (functions/api/usage.js). -->
<section class="step admin-section" id="stats-section">
  <h2 data-i18n="stats.title"></h2>
  <p class="hint" data-i18n="stats.lead"></p>
  <p class="admin-status" id="stats-status" data-i18n="admin.loading"></p>
  <div id="stats-body" hidden>
    <div class="stat-grid" id="stats-totals"></div>
    <div class="stat-breakdowns">
      <div><h3 data-i18n="stats.byMode"></h3><table class="breakdown" id="stats-by-mode"></table></div>
      <div><h3 data-i18n="stats.byPreset"></h3><table class="breakdown" id="stats-by-preset"></table></div>
      <div><h3 data-i18n="stats.byVersion"></h3><table class="breakdown" id="stats-by-version"></table></div>
    </div>
    <h3 class="stats-recent-title" data-i18n="stats.recent"></h3>
    <div class="results-wrap">
      <table class="results admin-table" id="stats-recent">
        <thead>
          <tr>
            <th data-i18n="admin.col.when"></th>
            <th data-i18n="stats.col.user"></th>
            <th data-i18n="stats.col.mode"></th>
            <th data-i18n="stats.col.preset"></th>
            <th data-i18n="stats.col.tracks"></th>
            <th data-i18n="stats.col.failed"></th>
            <th data-i18n="stats.col.seconds"></th>
            <th data-i18n="stats.col.version"></th>
          </tr>
        </thead>
        <tbody id="stats-recent-body"></tbody>
      </table>
    </div>
  </div>
</section>

<section class="step admin-section" id="feedback-section">
  <h2 data-i18n="admin.title"></h2>
  <p class="hint" data-i18n="admin.lead"></p>
  <p class="admin-status" id="admin-status" data-i18n="admin.loading"></p>

  <div class="results-wrap">
    <table class="results admin-table" id="admin-table" hidden>
      <thead>
        <tr>
          <th data-i18n="admin.col.when"></th>
          <th data-i18n="admin.col.invite"></th>
          <th data-i18n="admin.col.track"></th>
          <th data-i18n="admin.col.detected"></th>
          <th data-i18n="admin.col.corrected"></th>
          <th data-i18n="admin.col.bpmKey"></th>
        </tr>
      </thead>
      <tbody id="admin-body"></tbody>
    </table>
  </div>
</section>

<p><button type="button" class="button" id="admin-refresh" data-i18n="admin.refresh"></button></p>
</main>

<script src="js/i18n.js?v=2026.10.28.2" defer></script>
<script src="js/admin.js?v=2026.10.28.2" defer></script>
</body>
</html>
