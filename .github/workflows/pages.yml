# Publishes the browser app to GitHub Pages.
#
# Only web/ is uploaded. The Python script, the genre-map build tools and this
# workflow itself are part of the repository but not part of what a visitor
# downloads, and shipping them would only add weight to the first page load.
#
# There is no build step, deliberately: the app is static files that run as
# written. See web/README.md on why versioning is manual because of that.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy waits for the running one instead of cancelling it, so a
# half-uploaded site is never what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
